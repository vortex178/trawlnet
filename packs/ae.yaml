# Country pack: United Arab Emirates. Starting point: extend the city list and remote terms as needed.
# Everything country-specific the engine needs lives here; config.yaml picks the pack (`country: AE`) and
# may override any key under `pack_overrides:`. Validate edits with `python -m unittest discover tests`.
country: AE
name: United Arab Emirates
country_aliases: [uae, u a e, emirates]
currency: AED
fx_to_local: {USD: 3.67, EUR: 3.97, GBP: 4.65, INR: 0.044, SAR: 0.98}   # manual rates; refresh occasionally
timezone_default: Asia/Dubai

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  dubai: []
  abu dhabi: []
  sharjah: []

# Any place name in the country: "other city" rejection and country-targeted copies of multi-geo listings.
country_places: [united arab emirates, uae, dubai, abu dhabi, sharjah, ajman, ras al khaimah, al ain]

# Remote eligibility: kept if the location/region names a positive term, rejected if it names a reject term
# (checked after positives), otherwise decided from JD phrases like "must be based in ...".
remote_positive: [uae, united arab emirates, dubai, abu dhabi, mena, middle east, gcc, emea, gst]
remote_reject: [us, usa, u s, united states, america, americas, north america, canada, latam, latin america, south america,
                europe, european, eu, uk, united kingdom, england, london, germany, france, spain, portugal, netherlands,
                ireland, poland, romania, australia, new zealand, brazil, mexico, argentina, colombia, costa rica, japan,
                singapore, philippines, israel, south africa, nigeria, kenya, pst, est, cet, czechia, czech republic,
                ukraine, hungary, serbia, croatia, estonia, finland, italy, armenia, cyprus, georgia, greece, bulgaria,
                lithuania, latvia, slovakia, slovenia, austria, switzerland, belgium, denmark, sweden, norway, turkey,
                egypt, morocco, chile, peru, uruguay, vietnam, indonesia, malaysia, thailand, pakistan, bangladesh,
                san francisco, bay area, sf, new york, nyc, los angeles, seattle, boston, chicago, aus, anz, austin, denver,
                toronto, vancouver, berlin, amsterdam, paris, munich, tel aviv, india, apac, asia, ist, asia pacific,
                south asia, southeast asia, sydney, melbourne, sao paulo, mexico city, tokyo, seoul, hong kong, gmt, bst,
                cest, us only, usa only, scotland, wales]

indeed_country: AE
# adzuna: not available for this country (leave `sources.adzuna` off)
default_seed: uae
