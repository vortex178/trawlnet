# Country pack: Canada. Starting point: extend the city list and remote terms as needed.
# Everything country-specific the engine needs lives here; config.yaml picks the pack (`country: CA`) and
# may override any key under `pack_overrides:`. Validate edits with `python -m unittest discover tests`.
country: CA
name: Canada
country_aliases: []
currency: CAD
fx_to_local: {USD: 1.37, EUR: 1.48, GBP: 1.73, INR: 0.0165, AUD: 0.9}   # manual rates; refresh occasionally
timezone_default: America/Toronto

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  toronto: [gta, mississauga, brampton, markham, north york]
  vancouver: [burnaby, richmond bc, surrey bc]
  montreal: [montréal, laval]
  ottawa: [gatineau, kanata]
  calgary: []
  edmonton: []
  waterloo: [kitchener, guelph]
  halifax: []
  winnipeg: []
  quebec city: [québec]

# Any place name in the country: "other city" rejection and country-targeted copies of multi-geo listings.
country_places: [canada, toronto, vancouver, montreal, montréal, ottawa, calgary, edmonton, waterloo, kitchener, halifax,
                 winnipeg, quebec, québec, victoria, hamilton, london ontario, ontario, british columbia, alberta]

# Remote eligibility: kept if the location/region names a positive term, rejected if it names a reject term
# (checked after positives), otherwise decided from JD phrases like "must be based in ...".
remote_positive: [canada, north america, americas, est, pst]
remote_reject: [us, usa, u s, united states, america, latam, latin america, south america, europe, european, eu, emea, uk,
                united kingdom, england, london, germany, france, spain, portugal, netherlands, ireland, poland, romania,
                australia, new zealand, brazil, mexico, argentina, colombia, costa rica, japan, singapore, philippines, uae,
                dubai, israel, south africa, nigeria, kenya, cet, czechia, czech republic, ukraine, hungary, serbia,
                croatia, estonia, finland, italy, armenia, cyprus, georgia, greece, bulgaria, lithuania, latvia, slovakia,
                slovenia, austria, switzerland, belgium, denmark, sweden, norway, turkey, egypt, morocco, chile, peru,
                uruguay, vietnam, indonesia, malaysia, thailand, pakistan, bangladesh, san francisco, bay area, sf,
                new york, nyc, los angeles, seattle, boston, chicago, aus, anz, austin, denver, berlin, amsterdam, paris,
                munich, tel aviv, india, apac, asia, ist, asia pacific, south asia, southeast asia, mena, middle east, gcc,
                sydney, melbourne, sao paulo, mexico city, tokyo, seoul, hong kong, gmt, bst, cest, scotland, wales]

indeed_country: CA
adzuna:
  country: ca
  details_domain: www.adzuna.ca
  city_spellings: {}
default_seed: ca
