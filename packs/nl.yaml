# Country pack: Netherlands. Starting point: extend the city list and remote terms as needed.
# Everything country-specific the engine needs lives here; config.yaml picks the pack (`country: NL`) and
# may override any key under `pack_overrides:`. Validate edits with `python -m unittest discover tests`.
country: NL
name: Netherlands
country_aliases: [the netherlands, holland, nederland]
currency: EUR
fx_to_local: {USD: 0.92, GBP: 1.17, INR: 0.011, CHF: 1.05, CAD: 0.67}   # manual rates; refresh occasionally
timezone_default: Europe/Amsterdam

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  amsterdam: []
  rotterdam: []
  the hague: [den haag]
  utrecht: []
  eindhoven: []
  delft: []
  groningen: []
  leiden: []

# Any place name in the country: "other city" rejection and country-targeted copies of multi-geo listings.
country_places: [netherlands, the netherlands, holland, nederland, amsterdam, rotterdam, the hague, den haag, utrecht,
                 eindhoven, delft, groningen, leiden, haarlem, breda, tilburg, nijmegen]

# Remote eligibility: kept if the location/region names a positive term, rejected if it names a reject term
# (checked after positives), otherwise decided from JD phrases like "must be based in ...".
remote_positive: [netherlands, nederland, holland, benelux, eu, european union, europe, european, emea, cet, cest]
remote_reject: [us, usa, u s, united states, america, americas, north america, canada, latam, latin america, south america,
                uk, united kingdom, england, london, germany, france, spain, portugal, ireland, poland, romania, australia,
                new zealand, brazil, mexico, argentina, colombia, costa rica, japan, singapore, philippines, uae, dubai,
                israel, south africa, nigeria, kenya, pst, est, czechia, czech republic, ukraine, hungary, serbia, croatia,
                estonia, finland, italy, armenia, cyprus, georgia, greece, bulgaria, lithuania, latvia, slovakia, slovenia,
                austria, switzerland, belgium, denmark, sweden, norway, turkey, egypt, morocco, chile, peru, uruguay,
                vietnam, indonesia, malaysia, thailand, pakistan, bangladesh, san francisco, bay area, sf, new york, nyc,
                los angeles, seattle, boston, chicago, aus, anz, austin, denver, toronto, vancouver, berlin, paris, munich,
                tel aviv, india, apac, asia, ist, asia pacific, south asia, southeast asia, mena, middle east, gcc, sydney,
                melbourne, sao paulo, mexico city, tokyo, seoul, hong kong, gmt, bst, us only, usa only, scotland, wales]

indeed_country: NL
adzuna:
  country: nl
  details_domain: www.adzuna.nl
  city_spellings: {}
default_seed: eu
