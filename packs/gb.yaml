# Country pack: United Kingdom. Starting point: extend the city list and remote terms as needed.
# Everything country-specific the engine needs lives here; config.yaml picks the pack (`country: GB`) and
# may override any key under `pack_overrides:`. Validate edits with `python -m unittest discover tests`.
country: GB
name: United Kingdom
country_aliases: [uk, u k, great britain, britain, gb]
currency: GBP
fx_to_local: {USD: 0.79, EUR: 0.85, INR: 0.0095, CAD: 0.57, AUD: 0.51}   # manual rates; refresh occasionally
timezone_default: Europe/London

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  london: [greater london, canary wharf]
  manchester: [salford]
  edinburgh: []
  bristol: []
  birmingham: []
  glasgow: []
  leeds: []
  cambridge: []
  cardiff: []
  belfast: []
  oxford: []

# Any place name in the country: "other city" rejection and country-targeted copies of multi-geo listings.
country_places: [united kingdom, uk, great britain, britain, england, scotland, wales, northern ireland, london, manchester,
                 edinburgh, bristol, birmingham, glasgow, leeds, cambridge, cardiff, belfast, oxford, nottingham, sheffield,
                 liverpool, newcastle, reading, brighton, southampton, aberdeen, milton keynes]

# Remote eligibility: kept if the location/region names a positive term, rejected if it names a reject term
# (checked after positives), otherwise decided from JD phrases like "must be based in ...".
remote_positive: [uk, u k, united kingdom, great britain, britain, england, scotland, wales, northern ireland, gb, emea,
                  europe, european, gmt, bst]
remote_reject: [us, usa, u s, united states, america, americas, north america, canada, latam, latin america, south america,
                eu, germany, france, spain, portugal, netherlands, ireland, poland, romania, australia, new zealand, brazil,
                mexico, argentina, colombia, costa rica, japan, singapore, philippines, uae, dubai, israel, south africa,
                nigeria, kenya, pst, est, cet, czechia, czech republic, ukraine, hungary, serbia, croatia, estonia, finland,
                italy, armenia, cyprus, georgia, greece, bulgaria, lithuania, latvia, slovakia, slovenia, austria,
                switzerland, belgium, denmark, sweden, norway, turkey, egypt, morocco, chile, peru, uruguay, vietnam,
                indonesia, malaysia, thailand, pakistan, bangladesh, san francisco, bay area, sf, new york, nyc,
                los angeles, seattle, boston, chicago, aus, anz, austin, denver, toronto, vancouver, berlin, amsterdam,
                paris, munich, tel aviv, india, apac, asia, ist, asia pacific, south asia, southeast asia, mena,
                middle east, gcc, sydney, melbourne, sao paulo, mexico city, tokyo, seoul, hong kong, cest, us only,
                usa only]

indeed_country: GB
adzuna:
  country: gb
  details_domain: www.adzuna.co.uk
  city_spellings: {}
default_seed: uk
