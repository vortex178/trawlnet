# Country pack: India. Everything country-specific the engine needs lives here; config.yaml picks the pack
# (`country: IN`) and may override any key. Validate edits with `python -m unittest discover tests`.
country: IN
name: India                     # also the country word matched in locations ("Bengaluru, India")
country_aliases: []             # other spellings of the country name
currency: INR
fx_to_local: {USD: 83.0, EUR: 90.0, GBP: 105.0}   # manual rates; refresh occasionally
timezone_default: Asia/Kolkata

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  delhi ncr: [ncr, delhi, new delhi, gurugram, gurgaon, noida, greater noida, ghaziabad, faridabad]
  bengaluru: [bangalore]
  hyderabad: [secunderabad]
  pune: []
  mumbai: [navi mumbai, thane, bombay]
  chennai: [madras]
  kolkata: [calcutta]
  ahmedabad: [gandhinagar]
  kochi: [cochin, ernakulam]
  jaipur: []
  chandigarh: [mohali, panchkula]

# Any place name in the country: "other city" rejection, Workday location facets, HN location hints,
# picking the country-targeted copy of multi-geo listings.
country_places: [india, bengaluru, bangalore, hyderabad, pune, chennai, mumbai, delhi, new delhi, gurugram, gurgaon,
                 noida, kolkata, ahmedabad, jaipur, kochi, thiruvananthapuram, trivandrum, coimbatore, indore,
                 chandigarh, mohali, bhubaneswar, nagpur, vadodara, mysuru, mysore, visakhapatnam]

# Remote eligibility: a remote job is kept if its location/region names a positive term, rejected if it names a
# reject term (checked after positives), and otherwise decided from JD phrases like "must be based in ...".
remote_positive: [india, apac, asia, asia pacific, south asia]
remote_reject: [us, usa, u s, united states, america, americas, north america, canada, latam, latin america,
                south america, europe, european, eu, emea, uk, united kingdom, england, london, germany, france,
                spain, portugal, netherlands, ireland, poland, romania, australia, new zealand, brazil, mexico,
                argentina, colombia, costa rica, japan, singapore, philippines, uae, dubai, israel, south africa,
                nigeria, kenya, pst, est, cet, czechia, czech republic, ukraine, hungary, serbia, croatia, estonia,
                finland, italy, armenia, cyprus, georgia, greece, bulgaria, lithuania, latvia, slovakia, slovenia,
                austria, switzerland, belgium, denmark, sweden, norway, turkey, egypt, morocco, chile, peru, uruguay,
                vietnam, indonesia, malaysia, thailand, pakistan, bangladesh, san francisco, bay area, sf, new york,
                nyc, los angeles, seattle, boston, chicago, aus, anz, austin, denver, toronto, vancouver, berlin,
                amsterdam, paris, munich, tel aviv]

indeed_country: IN
adzuna:
  country: in                   # api.adzuna.com/v1/api/jobs/<country>/search
  details_domain: www.adzuna.in # full postings: https://<details_domain>/details/<id>
  city_spellings: {gurugram: Gurgaon, bengaluru: Bangalore}   # Adzuna's names ('Gurugram' returns 0)
default_seed: in                # seeds/in.yaml
