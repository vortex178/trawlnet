# Country pack: Brazil. Starting point: extend the city list and remote terms as needed.
# Everything country-specific the engine needs lives here; config.yaml picks the pack (`country: BR`) and
# may override any key under `pack_overrides:`. Validate edits with `python -m unittest discover tests`.
country: BR
name: Brazil
country_aliases: [brasil]
currency: BRL
fx_to_local: {USD: 5.4, EUR: 5.9, GBP: 6.9, INR: 0.065, MXN: 0.29}   # manual rates; refresh occasionally
timezone_default: America/Sao_Paulo

# City catalog: key + aliases. Setup copies the user's chosen subset into config `accept_cities`.
cities:
  são paulo: [sao paulo, sp]
  rio de janeiro: [rio]
  belo horizonte: []
  curitiba: []
  porto alegre: []
  florianópolis: [florianopolis]
  brasília: [brasilia]
  recife: []
  campinas: []

# Any place name in the country: "other city" rejection and country-targeted copies of multi-geo listings.
country_places: [brazil, brasil, são paulo, sao paulo, rio de janeiro, belo horizonte, curitiba, porto alegre, florianópolis,
                 florianopolis, brasília, brasilia, recife, campinas, salvador, fortaleza, goiânia, goiania]

# Remote eligibility: kept if the location/region names a positive term, rejected if it names a reject term
# (checked after positives), otherwise decided from JD phrases like "must be based in ...".
remote_positive: [brazil, brasil, latam, latin america, south america, americas]
remote_reject: [us, usa, u s, united states, america, north america, canada, europe, european, eu, emea, uk, united kingdom,
                england, london, germany, france, spain, portugal, netherlands, ireland, poland, romania, australia,
                new zealand, mexico, argentina, colombia, costa rica, japan, singapore, philippines, uae, dubai, israel,
                south africa, nigeria, kenya, pst, est, cet, czechia, czech republic, ukraine, hungary, serbia, croatia,
                estonia, finland, italy, armenia, cyprus, georgia, greece, bulgaria, lithuania, latvia, slovakia, slovenia,
                austria, switzerland, belgium, denmark, sweden, norway, turkey, egypt, morocco, chile, peru, uruguay,
                vietnam, indonesia, malaysia, thailand, pakistan, bangladesh, san francisco, bay area, sf, new york, nyc,
                los angeles, seattle, boston, chicago, aus, anz, austin, denver, toronto, vancouver, berlin, amsterdam,
                paris, munich, tel aviv, india, apac, asia, ist, asia pacific, south asia, southeast asia, mena,
                middle east, gcc, sydney, melbourne, mexico city, tokyo, seoul, hong kong, gmt, bst, cest, us only,
                usa only, scotland, wales]

indeed_country: BR
adzuna:
  country: br
  details_domain: www.adzuna.com.br
  city_spellings: {}
default_seed: latam
